[project]
name = "worldscan-backend"
version = "0.2.0"
description = "FastAPI backend for WorldScan. Wraps rl_env, orchestrates Inngest jobs."
requires-python = ">=3.13"
dependencies = [
    # web
    "fastapi>=0.118",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",  # multipart uploads
    "httpx>=0.28",

    # db
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",

    # jobs
    "inngest>=0.4",

    # media + ml libs that the worker needs
    "ffmpeg-python>=0.2",
    "pillow>=11",

    # rl + sim (matches root requirements.txt; pinned at the floor)
    "mujoco>=3.2",
    "trimesh>=4.4",
    "numpy>=1.26",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "scipy>=1.11",

    # depth_fusion backend (worldscan-v2.3-depth-fusion)
    "transformers>=4.40",
    "torchvision>=0.17",
    "onnxruntime>=1.20",

    # cloud GPU inference for reconstruction backends (Replicate). Heavy models
    # (VGGT, Depth-Anything, COLMAP, gaussian-splatting) run remotely, never on
    # the dev laptop — see backends/_replicate.py.
    "replicate>=1.0",

    # observability
    "sentry-sdk[fastapi]>=2.18",

    # utility
    "nanoid>=2.0",

    # task codegen (worldscan-v3-rl-authoring PR-2)
    "anthropic>=0.49",

    # workspace member: shares the same venv so `from rl_env...` works
    "rl_env",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]

[tool.uv.sources]
rl_env = { workspace = true }
# CPU-only torch in Linux containers. The default Linux torch wheel pulls ~5GB
# of CUDA libs (nvidia-*, triton) that are useless in a CPU container and fill
# Docker Desktop's disk. The marker leaves the Mac host on its default (MPS)
# build untouched.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = [".", "../rl_env"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]  # let black handle line length

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
