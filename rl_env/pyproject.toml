[project]
name = "rl_env"
version = "0.1.0"
description = "WorldScan Tier 1 RL pipeline: mesh -> MJCF -> Gymnasium env -> PPO."
requires-python = ">=3.13"
dependencies = [
    "mujoco>=3.2",
    "trimesh>=4.4",
    "numpy>=1.26",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rl_env"]
